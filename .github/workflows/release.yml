name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  PLUGIN_NAME: table-sizer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      # Obsidian downloads the release whose tag matches manifest.json "version",
      # so a mismatch makes the plugin uninstallable. Fail loudly instead.
      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag (${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "Version $MANIFEST_VERSION matches tag."

      # Convenience archive for manual installs. The plugin folder is a top
      # level entry in the zip, so extracting into `.obsidian/plugins/` drops
      # the files exactly where Obsidian expects them.
      - name: Package plugin folder
        run: |
          ARCHIVE="${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip"
          rm -rf package "${ARCHIVE}"
          mkdir -p "package/${PLUGIN_NAME}"
          cp main.js manifest.json styles.css "package/${PLUGIN_NAME}/"
          (cd package && zip -r "../${ARCHIVE}" "${PLUGIN_NAME}")
          echo "--- archive contents ---"
          unzip -l "${ARCHIVE}"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" \
            --clobber
